<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>GameLink</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #0b0d12; color: #e6e8ee;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px;
    overflow: hidden;
  }
  button { cursor: pointer; border: none; font-family: inherit; }

  /* ---------- Bağlantı ekranı ---------- */
  #connectView { display: flex; height: 100%; }

  .sidebar {
    width: 280px; background: #101420; border-right: 1px solid #1c2130;
    display: flex; flex-direction: column;
  }
  .sidebar-header { padding: 16px 18px; border-bottom: 1px solid #1c2130; }
  .sidebar-header h1 { font-size: 16px; margin: 0; }
  .conn-list { flex: 1; overflow-y: auto; padding: 8px; }
  .conn-item {
    padding: 10px 12px; border-radius: 8px; margin-bottom: 6px; cursor: pointer;
    background: #141824; display: flex; align-items: center; gap: 8px;
  }
  .conn-item:hover { background: #1a2032; }
  .conn-item .label { flex: 1; font-weight: 600; font-size: 13px; }
  .conn-item .del { color: #7d879c; background: none; font-size: 15px; padding: 2px 6px; border-radius: 5px; }
  .conn-item .del:hover { color: #ff6b6b; background: #2a1a20; }
  .empty-note { color: #7d879c; font-size: 12px; padding: 14px; }

  .main-form {
    flex: 1; display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: #141824; padding: 28px 32px; border-radius: 14px; width: 320px;
  }
  .card h2 { font-size: 16px; margin: 0 0 18px; }
  .card label { font-size: 11px; color: #9aa3b5; display: block; margin: 12px 0 5px; text-transform: uppercase; letter-spacing: .4px; }
  .card input {
    width: 100%; padding: 10px 11px; border-radius: 8px; border: 1px solid #2a3040;
    background: #0f1219; color: #e6e8ee; font-size: 14px;
  }
  .card input:focus { outline: none; border-color: #5b8cff; }
  .card button.primary {
    width: 100%; margin-top: 20px; padding: 11px; border-radius: 8px;
    background: #5b8cff; color: white; font-size: 14px; font-weight: 600;
  }
  .card button.primary:disabled { opacity: .5; }
  #connectStatus { margin-top: 12px; font-size: 12px; text-align: center; color: #9aa3b5; min-height: 16px; }
  #connectStatus.err { color: #ff6b6b; }

  /* ---------- Video sahnesi ---------- */
  #stageView { display: none; height: 100%; position: relative; background: black; }
  video { width: 100%; height: 100%; object-fit: contain; cursor: none; }

  #topBar {
    position: absolute; top: 0; left: 0; right: 0; padding: 10px 16px;
    display: flex; align-items: center; gap: 10px; background: linear-gradient(rgba(0,0,0,.6), transparent);
    transition: opacity .3s;
  }
  #topBar .spacer { flex: 1; }
  #topBar button {
    background: rgba(20,24,36,.85); color: #e6e8ee; padding: 7px 12px; border-radius: 7px; font-size: 12px;
  }
  #topBar button:hover { background: rgba(40,46,64,.95); }
  #topBar button.active { background: #5b8cff; }
  #hint {
    background: rgba(0,0,0,.55); padding: 5px 12px; border-radius: 16px; font-size: 11px; color: #cfd4e0;
  }

  #settingsPanel {
    position: absolute; top: 52px; right: 16px; width: 260px; background: #141824;
    border: 1px solid #262c3d; border-radius: 10px; padding: 14px; display: none;
  }
  #settingsPanel.open { display: block; }
  #settingsPanel h3 { font-size: 11px; text-transform: uppercase; color: #7d879c; margin: 0 0 8px; }
  .seg { display: flex; gap: 4px; margin-bottom: 14px; }
  .seg button {
    flex: 1; padding: 7px 4px; background: #0f1219; color: #cfd4e0; border-radius: 6px; font-size: 11px;
  }
  .seg button.active { background: #5b8cff; color: white; }
  .custom-row { display: flex; gap: 6px; margin-bottom: 8px; }
  .custom-row label { font-size: 10px; color: #9aa3b5; display: block; margin-bottom: 3px; }
  .custom-row input { width: 100%; padding: 6px 8px; font-size: 12px; border-radius: 6px; border: 1px solid #2a3040; background: #0f1219; color: #e6e8ee; }

  #settingsPanel select {
    width: 100%; padding: 7px 8px; font-size: 12px; border-radius: 6px;
    border: 1px solid #2a3040; background: #0f1219; color: #e6e8ee; margin-bottom: 14px;
  }
  .toggle-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .toggle-row input[type=checkbox] { width: 14px; height: 14px; accent-color: #5b8cff; }
  .toggle-row label { font-size: 12px; color: #cfd4e0; }

  #statsInfo { color: #9aa3b5; font-size: 11px; font-family: "Consolas", monospace; }
  #statsBox {
    position: absolute; top: 52px; left: 16px; background: rgba(15,18,25,.92);
    border: 1px solid #262c3d; border-radius: 10px; padding: 10px 12px; display: none;
    font-size: 11px; min-width: 190px;
  }
  #statsBox.open { display: block; }
  #statsBox div { display: flex; justify-content: space-between; gap: 16px; padding: 3px 0; }
  #statsBox span { color: #7d879c; }
  #statsBox b { font-family: "Consolas", monospace; color: #cfd4e0; font-weight: 600; }
</style>
</head>
<body>

<div id="connectView">
  <div class="sidebar">
    <div class="sidebar-header"><h1>GameLink</h1></div>
    <div id="connList" class="conn-list"></div>
  </div>
  <div class="main-form">
    <div class="card">
      <h2 id="formTitle">Yeni Bağlantı</h2>
      <label>Sunucu Adresi</label>
      <input id="serverUrl" placeholder="wss://sizin-domaininiz.com" />
      <label>Kod</label>
      <input id="code" placeholder="A3F9-K2LX" maxlength="16" />
      <label>Parola <span id="passwordOptionalNote" style="text-transform:none;color:#5b6270;"></span></label>
      <input id="password" type="password" placeholder="••••••••" />
      <button id="connectBtn" class="primary">Bağlan</button>
      <div id="connectStatus"></div>
    </div>
  </div>
</div>

<div id="stageView">
  <video id="remoteVideo" autoplay playsinline></video>

  <div id="topBar">
    <span id="hint">Fareyi kilitlemek için tıklayın · ESC ile çıkış · F11 tam ekran</span>
    <span id="statsInfo"></span>
    <div class="spacer"></div>
    <button id="statsBtn">📊 İstatistik</button>
    <button id="fullscreenBtn">⛶ Tam Ekran</button>
    <button id="settingsBtn">⚙ Ayarlar</button>
    <button id="disconnectBtn">Bağlantıyı Kes</button>
  </div>

  <div id="statsBox"></div>

  <div id="settingsPanel">
    <div id="monitorSection" style="display:none;">
      <h3>Monitör</h3>
      <select id="monitorSelect"></select>
    </div>

    <h3>Mod</h3>
    <div class="seg" id="modeSeg">
      <button data-mode="game" class="active">🎮 Oyun</button>
      <button data-mode="normal">💼 Normal</button>
      <button data-mode="stream">📺 Streaming</button>
    </div>
    <h3>Kalite</h3>
    <div class="seg" id="qualitySeg">
      <button data-quality="data-saver">🐢 Veri Tasarrufu</button>
      <button data-quality="balanced" class="active">⚖ Dengeli</button>
      <button data-quality="high">🚀 Yüksek</button>
      <button data-quality="custom">⚙ Özel</button>
    </div>
    <div id="customControls" style="display:none;">
      <div class="custom-row">
        <div style="flex:1;"><label>Ölçek</label>
          <input id="customScale" type="number" step="0.1" min="1" value="1.5" />
        </div>
        <div style="flex:1;"><label>FPS</label>
          <input id="customFps" type="number" step="1" min="10" max="60" value="30" />
        </div>
      </div>
      <div class="custom-row">
        <div style="flex:1;"><label>Bitrate (Mbps)</label>
          <input id="customBitrate" type="number" step="0.5" min="0.5" value="3" />
        </div>
      </div>
      <button id="applyCustomBtn" style="width:100%;padding:8px;background:#5b8cff;color:white;border-radius:6px;font-size:12px;">Uygula</button>
    </div>

    <h3 style="margin-top:14px;">Pano</h3>
    <div class="toggle-row">
      <input id="clipboardToggle" type="checkbox" checked />
      <label for="clipboardToggle">Panoyu host ile eşitle</label>
    </div>
  </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
