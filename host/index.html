<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>GameLink Host</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #0b0d12; color: #e6e8ee;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px;
    -webkit-user-select: none; user-select: none;
  }
  .titlebar {
    padding: 14px 18px; display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid #1c2130;
  }
  .titlebar .dot {
    width: 9px; height: 9px; border-radius: 50%; background: #556; flex-shrink: 0;
  }
  .titlebar .dot.connected { background: #3ddc84; box-shadow: 0 0 8px #3ddc8488; }
  .titlebar .dot.waiting { background: #f5b544; }
  .titlebar h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .titlebar .status-text { margin-left: auto; color: #9aa3b5; font-size: 12px; }

  .content { padding: 16px 18px; overflow-y: auto; height: calc(100% - 50px); }
  .card {
    background: #141824; border: 1px solid #1c2130; border-radius: 12px;
    padding: 16px; margin-bottom: 14px;
  }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #7d879c; margin: 0 0 12px; }

  .code-display {
    font-family: "Consolas", monospace; font-size: 26px; font-weight: 700; letter-spacing: 2px;
    text-align: center; padding: 14px; background: #0f1219; border-radius: 8px; color: #7fb0ff;
    -webkit-user-select: all; user-select: all;
  }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  input[type=text], input[type=password] {
    flex: 1; padding: 9px 11px; border-radius: 7px; border: 1px solid #2a3040;
    background: #0f1219; color: #e6e8ee; font-size: 13px;
  }
  input:focus { outline: none; border-color: #5b8cff; }
  button {
    padding: 9px 14px; border-radius: 7px; border: none; background: #5b8cff;
    color: white; font-weight: 600; cursor: pointer; font-size: 12px; white-space: nowrap;
  }
  button:hover { background: #4a7bef; }
  button.secondary { background: #262c3d; color: #cfd4e0; }
  button.secondary:hover { background: #323a4f; }
  button.danger { background: #3a2030; color: #ff8080; }
  button.danger:hover { background: #4a2838; }

  .device-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 0;
    border-bottom: 1px solid #1c2130;
  }
  .device-item:last-child { border-bottom: none; }
  .device-item .info { flex: 1; min-width: 0; }
  .device-item .name { font-weight: 600; font-size: 13px; }
  .device-item .meta { color: #7d879c; font-size: 11px; margin-top: 2px; }
  .empty-note { color: #7d879c; font-size: 12px; padding: 6px 0; }

  .log {
    font-family: "Consolas", monospace; font-size: 11px; color: #7d879c;
    background: #0f1219; border-radius: 8px; padding: 10px; height: 110px;
    overflow-y: auto; white-space: pre-wrap; line-height: 1.5;
  }
  .save-hint { font-size: 11px; color: #4caf7d; margin-top: 6px; height: 14px; }
</style>
</head>
<body>

<div class="titlebar">
  <div id="statusDot" class="dot"></div>
  <h1>GameLink Host</h1>
  <div id="statusText" class="status-text">Başlatılıyor...</div>
</div>

<div class="content">

  <div class="card">
    <h2>Bağlantı Kodu</h2>
    <div id="codeDisplay" class="code-display">----&nbsp;----</div>
    <div class="row">
      <button id="regenBtn" class="secondary">Yeniden Üret</button>
    </div>
  </div>

  <div class="card">
    <h2>Parola</h2>
    <div class="row">
      <input id="passwordInput" type="password" placeholder="Yeni parola girin" />
      <button id="savePasswordBtn">Kaydet</button>
    </div>
    <div id="passwordHint" class="save-hint"></div>
  </div>

  <div class="card">
    <h2>Sunucu Adresi</h2>
    <div class="row">
      <input id="urlInput" type="text" placeholder="wss://sizin-domaininiz.com" />
      <button id="saveUrlBtn">Kaydet</button>
    </div>
    <div id="urlHint" class="save-hint"></div>
  </div>

  <div class="card">
    <h2>Güvenilir Cihazlar</h2>
    <div id="deviceList"></div>
  </div>

  <div class="card">
    <h2>Günlük</h2>
    <div id="logBox" class="log"></div>
  </div>

</div>

<script src="renderer.js"></script>
</body>
</html>
